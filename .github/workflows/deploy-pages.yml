name: Deploy to GitHub Pages

# Publishes the static site in lichen_knitting_website/ to GitHub Pages.
# GitHub Pages is used alongside Cloudflare because *.workers.dev is not reachable
# from mainland China (DNS poisoning), while *.github.io is.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lichen_knitting_website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4